<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Journal — FX Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="journal">
  <div id="nav"></div>

  <div class="app-main">
    <h1 class="page-title">Trade Journal + AI Coach</h1>
    <p class="page-sub">Log every trade honestly. The coach scores discipline, risk and psychology for every entry and for your weekly results.</p>

    <div class="two-col">
      <div>
        <div class="card">
          <h3 style="font-size:17px;margin-bottom:14px">Add a trade</h3>
          <div class="err" id="err"></div>
          <form id="tradeForm">
            <div class="two-col" style="gap:10px">
              <div class="field"><label>Pair</label><select id="pair"></select></div>
              <div class="field">
                <label>Direction</label>
                <select id="direction">
                  <option value="buy">Buy (long)</option>
                  <option value="sell">Sell (short)</option>
                </select>
              </div>
            </div>
            <div class="two-col" style="gap:10px">
              <div class="field"><label>Entry price</label><input id="entry" type="number" step="any" required placeholder="1.0845" /></div>
              <div class="field"><label>Exit price</label><input id="exit" type="number" step="any" placeholder="1.0890" /></div>
            </div>
            <div class="two-col" style="gap:10px">
              <div class="field"><label>Stop loss</label><input id="stopLoss" type="number" step="any" placeholder="1.0790" /></div>
              <div class="field"><label>Take profit</label><input id="takeProfit" type="number" step="any" placeholder="1.0950" /></div>
            </div>
            <div class="two-col" style="gap:10px">
              <div class="field"><label>Lot size</label><input id="lots" type="number" step="any" placeholder="0.10" /></div>
              <div class="field"><label>Opened on</label><input id="openedAt" type="datetime-local" /></div>
            </div>
            <div class="field">
              <label>Notes / mindset (e.g. "fomo", "followed plan", "revenge")</label>
              <textarea id="notes" rows="2" placeholder="What was your reasoning? How did you feel?"></textarea>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <button class="btn btn-primary" type="submit">Log trade</button>
              <button class="btn" type="button" id="reviewBtn">Run AI coach review</button>
            </div>
          </form>
        </div>
      </div>

      <div>
        <div class="coach" id="coachBox" style="min-height:180px">
          <p class="small">Your AI coach summary will appear here after you log a few trades.</p>
        </div>
        <div class="stat-row mt" style="grid-template-columns:repeat(3,1fr)">
          <div class="stat"><div class="label">Win rate</div><div class="value" id="cWin">—</div></div>
          <div class="stat"><div class="label">Avg R</div><div class="value" id="cR">—</div></div>
          <div class="stat"><div class="label">Profit factor</div><div class="value" id="cPF">—</div></div>
        </div>
      </div>
    </div>

    <h2 style="font-size:18px;margin:30px 0 4px">Logged trades <span class="tag" id="tradeCount"></span></h2>
    <div class="trade-list" id="trades"></div>
  </div>

  <script src="/app/app.js"></script>
  <script src="/app/journal.js"></script>
</body>
</html>
